<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will you be my Valentine? 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #f8cfc8, #f6b7c9);
    }

    .card {
      background: #fff;
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 35px rgba(0,0,0,0.15);
      position: relative;
      z-index: 2;
    }

    .face {
      font-size: 56px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .yes-btn {
      background: #ff4d7e;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 999px;
      cursor: pointer;
    }

    .no-btn {
      position: absolute;
      background: #adb5bd;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
    }

    .hint {
      margin-top: 45px;
      font-size: 13px;
      color: #777;
    }

    /* 🎆 Fireworks */
    .firework {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: firework-burst 2.5s ease-out forwards;
    }

    @keyframes firework-burst {
      0% {
        transform: translate(0, 0) scale(0.3) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--x), var(--y)) scale(1.4) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <div class="face">🐱💗</div>
    <h2>Mahima will you be my valentine?</h2>

    <button class="yes-btn" id="yes">Yes 💖</button>
    <button class="no-btn" id="no">No 😢</button>

    <div class="hint">"No" is feeling shy today 😏</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const noBtn = document.getElementById("no");
      const card = document.getElementById("card");
      const yesBtn = document.getElementById("yes");

      function moveNoButton() {
        const rect = card.getBoundingClientRect();
        noBtn.style.left = Math.random() * (rect.width - 80) + "px";
        noBtn.style.top = Math.random() * (rect.height - 80) + "px";
      }

      noBtn.addEventListener("mouseover", moveNoButton);
      noBtn.addEventListener("touchstart", moveNoButton);

      yesBtn.addEventListener("click", () => {
        card.remove();

        for (let i = 0; i < 45; i++) {
          setTimeout(createFirework, i * 40);
        }
      });

      function createFirework() {
        const emojis = ["🎆", "🎇", "✨", "💖"];
        const fw = document.createElement("div");
        fw.className = "firework";
        fw.innerText = emojis[Math.floor(Math.random() * emojis.length)];

        const startX = window.innerWidth / 2;
        const startY = window.innerHeight / 2;

        const moveX = (Math.random() - 0.5) * 400;
        const moveY = (Math.random() - 0.5) * 400;

        fw.style.left = startX + "px";
        fw.style.top = startY + "px";
        fw.style.fontSize = Math.random() * 20 + 20 + "px";
        fw.style.setProperty("--x", moveX + "px");
        fw.style.setProperty("--y", moveY + "px");

        document.body.appendChild(fw);
        setTimeout(() => fw.remove(), 2500);
      }

    });
  </script>

</body>
</html>
